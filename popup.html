<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>Ci-en Banner Blocker</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 12px;
        min-width: 260px;
      }

      .options {
        display: grid;
        gap: 10px;
      }

      label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="options">
      <label>
        <input type="checkbox" id="net-banner-toggle" />
        ci-en.net のバナーを非表示にする
      </label>
      <label>
        <input type="checkbox" id="r18-banner-toggle" />
        ci-en.dlsite.com (R18) のバナーを非表示にする
      </label>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
